# Exemple de configuration btmuxd — copie vers /etc/btmux/config.yaml puis adapter.
# Validation : btmuxd --config /etc/btmux/config.yaml --check-config
# Schema de reference : contracts/config-schema.md

# v0.2.0 : deux adaptateurs Bluetooth (2 x TP-Link UB500), identifies par MAC (bluetoothctl list), jamais hci0/hci1.
adapters:
  - mac: "AA:BB:CC:00:00:01"   # hci-src : vu comme un CASQUE par les sources (PC, telephones)
    name: "btmux"              # nom Bluetooth annonce (1..248 octets UTF-8)
    roles: [sources]
  - mac: "AA:BB:CC:00:00:02"   # hci-hp : vu comme une SOURCE par les casques
    name: "btmux-hp"
    roles: [headsets]
# Forme mono-adaptateur (toujours valide) : une seule entree qui porte les deux roles.
# adapters:
#   - mac: "AA:BB:CC:00:00:01"
#     name: "btmux"
#     roles: [sources, headsets]

# Appareils connus (liste, peut etre vide). alias : [a-z0-9][a-z0-9-]{0,31}
devices:
  - { mac: "11:22:33:44:55:01", alias: "pc-pro",    kind: source,  priority: 10 }
  - { mac: "11:22:33:44:55:02", alias: "tel-perso", kind: source,  priority: 20 }
  - { mac: "11:22:33:44:55:03", alias: "xm5",       kind: headset }

# Route par defaut : alias du casque -> alias de la source
default_routes:
  xm5: pc-pro

# API HTTP (optionnel) — valeurs par defaut ci-dessous.
# listen : "0.0.0.0:8088" = tout le LAN (Web UI) ; "127.0.0.1:8088" = local seulement (btmuxctl, tunnel SSH).
# Tout /api/* exige le jeton (Authorization: Bearer <contenu de token_file>) ; sans jeton lisible, l'API reste verrouillee.
api:
  listen: "0.0.0.0:8088"
  token_file: /etc/btmux/token

mqtt:
  enabled: false

# Fenetre d'appairage (optionnel ; valeurs par defaut ci-dessous)
pairing:
  default_duration: 60     # 1..300 s : duree par defaut d'une fenetre d'appairage
  accept_incoming: true    # accepter les appairages entrants sur l'adaptateur `sources` PENDANT une fenetre
