# Gabarit WirePlumber « à blanc » (TOUT est commenté : aucun effet tant qu'on ne le décommente pas) — rôles Bluetooth par adaptateur.
# Installation (si besoin) : ~/.config/wireplumber/wireplumber.conf.d/53-btmux-roles.conf puis, CONTRÔLEUR ÉTEINT et AUCUN appareil
# connecté (`sudo btmgmt power off`), `systemctl --user restart wireplumber`, puis rallumer. Retour arrière : supprimer le fichier.
#
# But (#18, T3.2b) : si Windows/téléphone se comportent mal devant les rôles exposés, ne publier sur l'adaptateur « sources »
# que les rôles casque (A2DP sink + HFP HF) et sur l'adaptateur « headsets » que les rôles source (A2DP source + HFP AG).
# WirePlumber applique `bluez5.roles` par appareil Bluetooth distant (règle sur `device.name`), pas par adaptateur local :
# la séparation propre se fait donc d'abord par la configuration des adaptateurs (rôles `sources` / `headsets` de btmux) ;
# ce gabarit sert à tester une restriction globale, ou ciblée sur un appareil distant connu (MAC).
#
# monitor.bluez.rules = [
#   {
#     # restriction globale : le Pi n'annonce que les rôles « casque » à tous les appareils distants
#     matches = [ { device.name = "~bluez_card.*" } ]
#     actions = { update-props = { bluez5.roles = [ a2dp_sink hfp_hf ] } }
#   }
#   # {
#   #   # restriction ciblée sur un appareil distant (MAC avec _ comme séparateur)
#   #   matches = [ { device.name = "bluez_card.84_7B_57_XX_XX_XX" } ]
#   #   actions = { update-props = { bluez5.roles = [ a2dp_sink hfp_hf ] } }
#   # }
# ]
