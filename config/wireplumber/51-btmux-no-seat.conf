# btmux — WirePlumber en mode headless : désactive la surveillance de "seat" (logind) du moniteur Bluetooth.
#
# Pourquoi : btmuxd tourne sous un utilisateur avec linger, sans session graphique (aucun seat). WirePlumber
# n'active alors pas monitors/bluez.lua : BlueZ ne reçoit aucun point de terminaison A2DP/HFP et n'annonce
# que AVRCP (aucun profil audio en SDP).
# Installation : ~/.config/wireplumber/wireplumber.conf.d/51-btmux-no-seat.conf de l'utilisateur de service
# (scripts/deploy.sh et postinst du .deb, sans écraser un fichier existant), puis
#   systemctl --user restart wireplumber
# Vérification : bluetoothctl show | grep UUID  -> Audio Sink (110b), Audio Source (110a), HFP AG (111f), HF (111e).
# Retour arrière : supprimer le fichier et redémarrer wireplumber.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
