# Charge btmux-route.lua dans WirePlumber (utilisateur de service). Copier vers
# ~/.config/wireplumber/wireplumber.conf.d/52-btmux-route.conf ; le script va dans
# ~/.local/share/wireplumber/scripts/btmux-route.lua. Retour arrière : supprimer les deux fichiers.
wireplumber.components = [
  {
    name = btmux-route.lua, type = script/lua
    provides = custom.btmux-route
  }
]
wireplumber.profiles = {
  main = {
    custom.btmux-route = required
  }
}
