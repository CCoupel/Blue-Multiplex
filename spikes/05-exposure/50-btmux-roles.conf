# Variante R4 du spike #5 — NON ACTIVE par défaut (tout est commenté).
# À copier vers ~/.config/wireplumber/wireplumber.conf.d/50-btmux-roles.conf puis
#   systemctl --user restart wireplumber
# uniquement si Windows voit mal les profils source/AG exposés par le Pi (casque non reconnu, double périphérique).
# Retour arrière : supprimer le fichier et redémarrer wireplumber.
# Provisoire — à revalider avec dongle RTL8761B.
#
# Rôles restreints à ce qu'un casque expose (A2DP sink + HFP HF) : le Pi n'annonce plus A2DP source / HFP AG.
# ATTENTION : cela retire aussi la capacité d'être source vers le casque (A2DP source / HFP AG) — à n'utiliser que
# pour mesurer ce que Windows voit, pas en configuration cible.
#
# monitor.bluez.properties = {
#   bluez5.roles = [ a2dp_sink hfp_hf ]
# }
