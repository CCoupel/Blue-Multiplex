# Prérequis headless du spike #5 : sans session graphique (pas de "seat" logind), WirePlumber désactive le
# moniteur Bluetooth (monitors/bluez.lua attend monitor.bluez.seat-monitoring) -> BlueZ ne reçoit aucun point
# de terminaison A2DP/HFP, aucun profil audio n'est annoncé en SDP.
# Copier vers ~/.config/wireplumber/wireplumber.conf.d/51-btmux-no-seat.conf puis `systemctl --user restart wireplumber`.
# Retour arrière : supprimer le fichier. Provisoire — à revalider avec dongle RTL8761B.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
