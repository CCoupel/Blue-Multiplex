# Pre-validation (contrat infra C10) : push sur milestone/* et a la demande — lecture seule, ne publie rien.
name: CI branch

on:
  push:
    branches: ['milestone/**', 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # 3.12 = plancher requires-python ; 3.14 = Python d'Ubuntu Server 26.04 (cible du Pi)
    name: CI (scripts/ci.sh, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: CI_CMD
        run: scripts/ci.sh
