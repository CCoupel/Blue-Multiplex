[project]
name = "btmux"
version = "0.2.0.6"
description = "Multiplexeur audio Bluetooth pour Raspberry Pi (btmuxd)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dbus-fast",
    "pyyaml",
    "pydantic>=2",
    "aiohttp>=3.14.5",
]

[project.scripts]
btmuxd = "btmux.cli.btmuxd:main"
btmuxctl = "btmux.cli.btmuxctl:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pip-audit",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/btmux"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes/*/output"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Code jetable des spikes : longueur de ligne libre (docstrings/commentaires en français)
"spikes/**" = ["E501"]
# Docstrings/commentaires en français (couche BlueZ, v0.2.0)
"src/btmux/bluez/**" = ["E501"]
"src/btmux/api/**" = ["E501"]
"src/btmux/cli/btmuxctl.py" = ["E501"]
"src/btmux/daemon.py" = ["E501"]
"src/btmux/log.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
exclude = ["spikes/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["spikes", ".venv", "dist", "build", "_work"]
markers = [
    "slow: test lent",
    "hardware: necessite BlueZ/PipeWire reels (Pi de qualif, jamais en CI)",
    "smoke: verification rapide post-deploiement",
    "critical: chemin critique",
]

[tool.coverage.run]
source = ["btmux"]
omit = ["spikes/*"]
